# Builds the app and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". No gh-pages branch is involved; the built site is
# uploaded straight from this workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish the current main from the Actions tab without a push.
  workflow_dispatch:

# The deploy step needs to write a Pages deployment and mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never publish two builds at once, but let a queued run finish rather than
# cancelling it: the last push to main should be what ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gates: a build that fails typecheck or the rules/perft/bot tests should
      # not reach the live site.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
